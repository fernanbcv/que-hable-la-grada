<div class="board">
  <div class="viewport">
    @for (layer of layers(); track layer.step) {
      <div class="layer" [class.on-air]="layer.onAir" [attr.aria-hidden]="!layer.onAir || null">
        <ul class="advert">
          @for (sponsor of layer.sponsors; track sponsor.name) {
            <li>
              <img [src]="sponsor.logo" [alt]="sponsor.name" [style.scale]="sponsor.scale" />
            </li>
          }
        </ul>
        <span class="sweep"></span>
      </div>
    }
  </div>
</div>
